appId: com.leadsender.app
productName: LeadSender
directories:
  output: release
  buildResources: build
files:
  - dist-electron
  - dist
  - package.json
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/whatsapp-web.js/**/*
win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
  publisherName: LeadSender
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LeadSender
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false
# Fork-local publish target.
#
# This MUST NOT point at the original author's repositories. It previously read
# owner: barelzrihan2002 / repo: leadsender-releases, which meant (a) a build run
# with a GH_TOKEN in the environment could push artifacts to their repo, and
# (b) a locally-built app would check THEIR release feed for updates and could
# install their binary over this build.
#
# It now points at this fork's own repo so the electron-updater code path stays
# functional, while the npm build scripts pass --publish never so nothing is ever
# uploaded unless you explicitly ask for it.
publish:
  provider: github
  owner: matanbenaroyo
  repo: leadsender
  releaseType: release
